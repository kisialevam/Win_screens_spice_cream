<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spice Cream — Big Win screen</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #130719;
      color: #fff7fd;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      background:
        radial-gradient(circle at 50% -20%, #68224f 0, transparent 42rem),
        linear-gradient(135deg, #17091f, #0a0611 70%);
    }

    .app {
      display: grid;
      grid-template-columns: minmax(280px, 340px) minmax(0, 1fr);
      min-height: 100vh;
    }

    .panel {
      position: sticky;
      top: 0;
      align-self: start;
      height: 100vh;
      overflow: auto;
      padding: 28px 24px;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(20, 8, 27, 0.9);
      backdrop-filter: blur(18px);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: #ff78ba;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(26px, 4vw, 36px);
      line-height: 0.98;
      letter-spacing: -0.04em;
    }

    .lead {
      margin: 14px 0 24px;
      color: #cbb8d2;
      font-size: 14px;
      line-height: 1.55;
    }

    .control-group {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.09);
    }

    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
      font-size: 13px;
      font-weight: 750;
    }

    .value {
      min-width: 52px;
      color: #ff9acb;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }

    .replay-button {
      width: 100%;
      min-height: 42px;
      margin-top: 22px;
      border: 1px solid #ff5cad;
      border-radius: 11px;
      background: linear-gradient(135deg, #ff4fa3, #ff86c0);
      color: #210a1b;
      cursor: pointer;
      font: inherit;
      font-size: 13px;
      font-weight: 800;
      transition: filter 140ms ease, transform 140ms ease;
    }

    .replay-button:hover { filter: brightness(1.08); }
    .replay-button:active { transform: translateY(1px); }

    .stage-area {
      min-width: 0;
      overflow: auto;
      padding: 38px clamp(20px, 6vw, 72px) 72px;
    }

    .stage-toolbar {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 20px;
    }

    .stage-toolbar h2 { margin: 0; font-size: 16px; }
    .stage-toolbar p { margin: 5px 0 0; color: #a995b1; font-size: 12px; }

    #stage-shell {
      position: relative;
      width: 366px;
      height: 792px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 18px;
      background: #31102b;
      box-shadow: 0 30px 90px rgba(0, 0, 0, 0.5), 0 0 0 8px rgba(255, 255, 255, 0.025);
      transition: width 120ms ease, height 120ms ease;
    }

    #game-container {
      width: 183px;
      height: 396px;
      transform: scale(2);
      transform-origin: top left;
      transition: transform 120ms ease;
    }

    #game-container canvas {
      display: block;
      image-rendering: auto;
      outline: none;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 3;
      background: #291026;
      color: #f7b5d5;
      font-size: 13px;
      letter-spacing: 0.04em;
    }

    .loading.is-hidden { display: none; }

    @media (max-width: 800px) {
      .app { display: block; }
      .panel { position: relative; height: auto; border-right: 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
      .stage-area { padding: 28px 20px 60px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <aside class="panel">
      <p class="eyebrow">Phaser 3 scene</p>
      <h1>Big Win<br>screen</h1>
      <p class="lead">Финальная композиция и параметры анимации зафиксированы.</p>

      <section class="control-group">
        <div class="label-row"><span>Режим сцены</span><span class="value">Финал</span></div>
        <p class="lead">Экран 183 × 396 · восемь зафиксированных слоёв · Phaser 3</p>
      </section>

      <button class="replay-button" id="replay-animation" type="button">Повторить анимацию</button>
    </aside>

    <section class="stage-area">
      <div class="stage-toolbar">
        <div>
          <h2>Экран игры · 183 × 396</h2>
          <p>Анимированная финальная композиция.</p>
        </div>
      </div>
      <div id="stage-shell">
        <div class="loading" id="loading">Загружаю Phaser…</div>
        <div id="game-container"></div>
      </div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
  <script>
    (() => {
      const WIDTH = 183;
      const HEIGHT = 396;
      const FLOAT_SPEED = 1;
      const FLOAT_HEIGHT = 1.5;
      const IMPACT_STRENGTH = 1.25;
      const ENTRY_SPEED = 2.4;
      const ENTRY_OVERSHOOT = 24;
      const ENTRY_BOUNCE_COUNT = 2;
      const ENTRY_BOUNCE_AMPLITUDE = 8;
      const ICE_JUMP_HEIGHT = 46;
      const ICE_HOLD = -160;
      const ICE_LEAD = 720;
      const BERRY_JUMP_HEIGHT = 23;
      const BERRY_HOLD = -160;
      const BERRY_LEAD = 290;
      const EXPLODE = { offsetX: -3, offsetY: -14, scale: 1.45, depth: 0, frameRate: 30 };
      const SPLASH = {
        rotation: -90,
        targetOffset: 31,
        horizontalOffset: -8,
        disappearOffset: 40,
        reactionStrength: 1.8,
        hangY: 4,
        emergeDuration: 420,
        hangDuration: 800,
        fallDuration: 380,
        repeatDelay: 4000
      };
      const ENTRY_APPROACH_EASE = (time) => {
        const remaining = 1 - time;
        return 1 - 0.85 * remaining ** 3 - 0.15 * remaining;
      };

      const ASSETS = [
        { key: 'big_win', label: 'Big Win', file: 'big_win.png', x: 91, y: 59, scale: 1, depth: 7 },
        { key: 'amount_42', label: '42.00', file: '42.00.png', x: 91, y: 98, scale: 1, depth: 8 },
        { key: 'x', label: 'X / множитель', file: 'x.png', x: 90, y: 296, scale: 1, depth: 6 },
        { key: 'strawberry', label: 'Клубника', file: 'strawberry.png', x: 99, y: 179, scale: 1, depth: 5 },
        { key: 'ice_cream', label: 'Мороженое', file: 'ice_cream.png', x: 92, y: 226, scale: 1, depth: 3 },
        { key: 'cream', label: 'Крем', file: 'cream.png', x: 82, y: 221, scale: 1, depth: 100 },
        { key: 'splash', label: 'Капля', file: 'splash.png', x: 99, y: -8, scale: 0.95, depth: 110 },
        { key: 'hand', label: 'Рука', file: 'hand.png?v=b2917e95', x: 5, y: 426, scale: 1.66, depth: 1 }
      ];

      const loading = document.querySelector('#loading');
      const replayButton = document.querySelector('#replay-animation');
      const assetByKey = new Map(ASSETS.map((asset) => [asset.key, asset]));
      let activeScene;

      replayButton.addEventListener('click', () => activeScene?.playIntroAnimation());

      class BigWinScene extends Phaser.Scene {
        constructor() { super('BigWinScene'); }

        preload() {
          this.load.atlas('explode', 'explode.png', 'explode.json');
          ASSETS.forEach(({ key, file }) => this.load.image(key, file));
        }

        create() {
          if (!this.anims.exists('explode-burst')) {
            this.anims.create({
              key: 'explode-burst',
              frames: this.anims.generateFrameNames('explode', {
                prefix: 'frame',
                start: 0,
                end: 22,
                zeroPad: 4,
                suffix: '.png'
              }),
              frameRate: EXPLODE.frameRate,
              repeat: 0
            });
          }

          this.explode = this.add.sprite(0, 0, 'explode', 'frame0000.png')
            .setScale(EXPLODE.scale)
            .setDepth(EXPLODE.depth)
            .setVisible(false);
          this.explode.on(Phaser.Animations.Events.ANIMATION_COMPLETE_KEY + 'explode-burst', () => {
            this.explode.setVisible(false);
          });

          this.sprites = new Map();
          ASSETS.forEach((asset) => {
            const sprite = this.add.image(asset.x, asset.y, asset.key)
              .setScale(asset.scale)
              .setDepth(asset.depth);
            this.sprites.set(asset.key, sprite);
          });

          const strawberry = this.sprites.get('strawberry');
          const cream = this.sprites.get('cream');
          const hand = this.sprites.get('hand');
          const iceCream = this.sprites.get('ice_cream');
          this.compositionContainer = this.add.container(0, 0).setDepth(1);
          this.compositionContainer.add([hand, iceCream, strawberry, cream]);
          this.berryTransform = { scaleX: 1, scaleY: 1 };

          activeScene = this;
          this.playIntroAnimation();
          loading.classList.add('is-hidden');
        }

        playIntroAnimation() {
          this.tweens.killAll();
          this.sequenceTimers?.forEach((timer) => timer.remove(false));
          this.sequenceTimers = [];
          this.floatingActive = false;
          this.floatingStartedAt = 0;
          this.explode.stop().setFrame('frame0000.png').setVisible(false);

          ASSETS.filter(({ key }) => key !== 'strawberry' && key !== 'cream').forEach((asset) => {
            this.sprites.get(asset.key)
              .setPosition(asset.x, asset.y)
              .setScale(asset.scale)
              .setAlpha(1)
              .setVisible(true);
          });

          const strawberryAsset = assetByKey.get('strawberry');
          const creamAsset = assetByKey.get('cream');
          this.compositionContainer.setPosition(0, 0);
          this.berryTransform.scaleX = 1;
          this.berryTransform.scaleY = 1;
          this.sprites.get('strawberry')
            .setPosition(strawberryAsset.x, strawberryAsset.y)
            .setScale(strawberryAsset.scale)
            .setAlpha(1)
            .setVisible(true);
          this.sprites.get('cream')
            .setPosition(creamAsset.x, creamAsset.y)
            .setScale(creamAsset.scale)
            .setAlpha(1)
            .setVisible(true);
          this.sprites.get('splash')
            .setAngle(SPLASH.rotation)
            .setAlpha(0)
            .setVisible(false);

          this.motion = {
            rootY: 260,
            iceY: 0,
            berryY: 0,
            rootImpactY: 0,
            iceImpactY: 0
          };
          this.sequenceState = {
            rootComplete: false,
            iceComplete: false,
            berryComplete: false,
            splashStarted: false,
            floating: false
          };
          this.syncHierarchy();

          const speed = ENTRY_SPEED;
          const entryDuration = 1000 / speed;
          const overshootHeight = ENTRY_OVERSHOOT;
          const iceStartDelay = Math.max(0, entryDuration - ICE_LEAD);

          this.sequenceTimers.push(this.time.delayedCall(iceStartDelay, () => {
            this.launchIceSequence();
          }));

          this.tweens.add({
            targets: this.motion,
            rootY: -overshootHeight,
            duration: entryDuration,
            ease: ENTRY_APPROACH_EASE,
            onUpdate: () => this.syncHierarchy(),
            onComplete: () => this.settleHandEntry()
          });
        }

        settleHandEntry() {
          const bounceCount = ENTRY_BOUNCE_COUNT;
          const bounceAmplitude = ENTRY_BOUNCE_AMPLITUDE;
          const finishArrival = () => this.completeSequencePart('rootComplete');

          if (bounceCount === 0 && ENTRY_OVERSHOOT === 0) {
            finishArrival();
            return;
          }

          if (bounceCount === 0 || bounceAmplitude === 0) {
            this.tweens.add({
              targets: this.motion,
              rootY: 0,
              duration: 160,
              ease: 'Linear',
              onUpdate: () => this.syncHierarchy(),
              onComplete: finishArrival
            });
            return;
          }

          this.playHandBounce(0, bounceCount, bounceAmplitude, finishArrival);
        }

        playHandBounce(index, bounceCount, baseAmplitude, onComplete) {
          if (index >= bounceCount) {
            this.tweens.add({
              targets: this.motion,
              rootY: 0,
              duration: 120,
              ease: 'Sine.Out',
              onUpdate: () => this.syncHierarchy(),
              onComplete
            });
            return;
          }

          const amplitude = baseAmplitude * 0.55 ** index;
          const duration = Math.max(75, 145 - index * 18);

          this.tweens.add({
            targets: this.motion,
            rootY: amplitude,
            duration,
            ease: index === 0 ? 'Linear' : 'Sine.In',
            onUpdate: () => this.syncHierarchy(),
            onComplete: () => {
              this.tweens.add({
                targets: this.motion,
                rootY: -amplitude * 0.45,
                duration: Math.max(65, duration - 20),
                ease: 'Sine.Out',
                onUpdate: () => this.syncHierarchy(),
                onComplete: () => this.playHandBounce(index + 1, bounceCount, baseAmplitude, onComplete)
              });
            }
          });
        }

        syncHierarchy() {
          const hand = this.sprites.get('hand');
          const iceCream = this.sprites.get('ice_cream');
          const motion = this.motion;
          const rootOffset = motion.rootY + motion.rootImpactY;
          const iceOffset = rootOffset + motion.iceY + motion.iceImpactY;
          const berryOffset = iceOffset + motion.berryY;

          hand.y = assetByKey.get('hand').y + rootOffset;
          iceCream.y = assetByKey.get('ice_cream').y + iceOffset;
          this.applyBerryTransform(
            assetByKey.get('strawberry').x,
            assetByKey.get('strawberry').y + berryOffset
          );
          this.explode.setPosition(
            iceCream.x + EXPLODE.offsetX,
            this.compositionContainer.y + iceCream.y + EXPLODE.offsetY
          );
        }

        applyBerryTransform(anchorX, anchorY) {
          const strawberryAsset = assetByKey.get('strawberry');
          const creamAsset = assetByKey.get('cream');
          const scaleX = this.berryTransform.scaleX;
          const scaleY = this.berryTransform.scaleY;

          this.sprites.get('strawberry')
            .setPosition(anchorX, anchorY)
            .setScale(strawberryAsset.scale * scaleX, strawberryAsset.scale * scaleY);
          this.sprites.get('cream')
            .setPosition(
              anchorX + (creamAsset.x - strawberryAsset.x) * scaleX,
              anchorY + (creamAsset.y - strawberryAsset.y) * scaleY
            )
            .setScale(creamAsset.scale * scaleX, creamAsset.scale * scaleY);
        }

        lockCompositionPose() {
          const strawberryAsset = assetByKey.get('strawberry');

          this.sprites.get('hand').setPosition(assetByKey.get('hand').x, assetByKey.get('hand').y);
          this.sprites.get('ice_cream').setPosition(assetByKey.get('ice_cream').x, assetByKey.get('ice_cream').y);
          this.applyBerryTransform(strawberryAsset.x, strawberryAsset.y);
        }

        getBerryWorldPosition() {
          const strawberry = this.sprites.get('strawberry');
          return {
            x: this.compositionContainer.x + strawberry.x,
            y: this.compositionContainer.y + strawberry.y
          };
        }

        launchSplashSequence() {
          const splash = this.sprites.get('splash');
          const strawberry = this.sprites.get('strawberry');
          const baseScale = assetByKey.get('splash').scale;
          const berryPosition = this.getBerryWorldPosition();
          const horizontalOffset = SPLASH.horizontalOffset;

          splash
            .setPosition(berryPosition.x + horizontalOffset, assetByKey.get('splash').y)
            .setScale(baseScale * 0.72, baseScale * 0.35)
            .setAngle(SPLASH.rotation)
            .setAlpha(0)
            .setVisible(true);

          this.tweens.add({
            targets: splash,
            y: SPLASH.hangY,
            alpha: 1,
            scaleX: baseScale * 0.92,
            scaleY: baseScale * 1.15,
            duration: SPLASH.emergeDuration,
            ease: 'Back.Out',
            onComplete: () => {
              this.tweens.add({
                targets: splash,
                y: SPLASH.hangY + 1.5,
                scaleX: baseScale * 0.88,
                scaleY: baseScale * 1.25,
                duration: 700,
                ease: 'Sine.InOut',
                yoyo: true,
                repeat: -1
              });

              this.sequenceTimers.push(this.time.delayedCall(SPLASH.hangDuration, () => {
                this.tweens.killTweensOf(splash);
                splash.setScale(baseScale).setAlpha(1);

                const currentBerryPosition = this.getBerryWorldPosition();
                const contactY = currentBerryPosition.y
                  - strawberry.displayHeight / 2
                  - splash.displayHeight / 2
                  + 4
                  + SPLASH.targetOffset;
                const disappearDelay = Math.max(
                  0,
                  SPLASH.fallDuration + SPLASH.disappearOffset
                );

                this.sequenceTimers.push(this.time.delayedCall(disappearDelay, () => {
                  splash.setAlpha(0).setVisible(false);
                }));

                this.tweens.add({
                  targets: splash,
                  x: currentBerryPosition.x + horizontalOffset,
                  y: contactY,
                  duration: SPLASH.fallDuration,
                  ease: 'Cubic.In',
                  onComplete: () => {
                    this.playSplashImpact();
                  }
                });
              }));
            }
          });
        }

        startSplashLoop() {
          this.launchSplashSequence();
          const splashLoop = this.time.addEvent({
            delay: SPLASH.repeatDelay,
            loop: true,
            callback: () => this.launchSplashSequence()
          });
          this.sequenceTimers.push(splashLoop);
        }

        playSplashImpact() {
          const strength = SPLASH.reactionStrength;
          this.tweens.killTweensOf(this.berryTransform);
          this.berryTransform.scaleX = 1;
          this.berryTransform.scaleY = 1;
          this.lockCompositionPose();

          if (strength === 0) return;

          this.tweens.add({
            targets: this.berryTransform,
            scaleX: 1 + 0.12 * strength,
            scaleY: 1 - 0.18 * strength,
            duration: 85,
            ease: 'Quad.Out',
            onUpdate: () => this.lockCompositionPose(),
            onComplete: () => {
              this.tweens.add({
                targets: this.berryTransform,
                scaleX: 1 - 0.04 * strength,
                scaleY: 1 + 0.08 * strength,
                duration: 130,
                ease: 'Back.Out',
                onUpdate: () => this.lockCompositionPose(),
                onComplete: () => {
                  this.tweens.add({
                    targets: this.berryTransform,
                    scaleX: 1,
                    scaleY: 1,
                    duration: 150,
                    ease: 'Sine.Out',
                    onUpdate: () => this.lockCompositionPose()
                  });
                }
              });
            }
          });
        }

        launchIceSequence() {
          const iceJumpHeight = ICE_JUMP_HEIGHT;
          const iceTiming = this.getJumpTiming(ICE_HOLD, 290, 310);
          const iceFlightDuration = iceTiming.riseDuration + iceTiming.holdDuration + iceTiming.landDuration;
          const berryStartDelay = Math.max(0, iceFlightDuration - BERRY_LEAD);

          this.sequenceTimers.push(this.time.delayedCall(berryStartDelay, () => {
            this.launchBerrySequence();
          }));

          this.jumpNode(
            'iceY',
            iceJumpHeight,
            iceTiming.riseDuration,
            iceTiming.holdDuration,
            iceTiming.landDuration,
            () => {
              this.playLandingImpact('rootImpactY', 'ice_cream', 6, () => {
                this.completeSequencePart('iceComplete');
              });
            },
            () => this.playExplodeSequence()
          );
        }

        playExplodeSequence() {
          this.explode
            .setScale(EXPLODE.scale)
            .setVisible(true)
            .play('explode-burst', true);
        }

        launchBerrySequence() {
          const berryJumpHeight = BERRY_JUMP_HEIGHT;
          const berryTiming = this.getJumpTiming(BERRY_HOLD, 250, 280);
          this.jumpNode('berryY', berryJumpHeight, berryTiming.riseDuration, berryTiming.holdDuration, berryTiming.landDuration, () => {
            this.playLandingImpact('iceImpactY', 'strawberry', 4, () => {
              this.completeSequencePart('berryComplete');
            });
          });
        }

        getJumpTiming(holdValue, baseRiseDuration, baseLandDuration) {
          const compression = Math.min(0, holdValue) / 2;
          return {
            riseDuration: Math.max(80, baseRiseDuration + compression),
            holdDuration: Math.max(0, holdValue),
            landDuration: Math.max(80, baseLandDuration + compression)
          };
        }

        completeSequencePart(part) {
          this.sequenceState[part] = true;
          const mainSequenceComplete = (
            this.sequenceState.rootComplete
            && this.sequenceState.iceComplete
            && this.sequenceState.berryComplete
          );

          if (mainSequenceComplete) {
            if (!this.sequenceState.floating) {
              this.sequenceState.floating = true;
              this.startFloating();
            }

            if (!this.sequenceState.splashStarted) {
              this.sequenceState.splashStarted = true;
              this.startSplashLoop();
            }
          }
        }

        jumpNode(property, height, riseDuration, holdDuration, landDuration, onComplete, onApex = null) {
          this.tweens.add({
            targets: this.motion,
            [property]: -height,
            duration: riseDuration,
            ease: 'Quart.Out',
            onUpdate: () => this.syncHierarchy(),
            onComplete: () => {
              onApex?.();
              const startLanding = () => {
                this.tweens.add({
                  targets: this.motion,
                  [property]: 0,
                  duration: landDuration,
                  ease: 'Quart.In',
                  onUpdate: () => this.syncHierarchy(),
                  onComplete
                });
              };

              if (holdDuration === 0) {
                startLanding();
              } else {
                this.sequenceTimers.push(this.time.delayedCall(holdDuration, startLanding));
              }
            }
          });
        }

        playLandingImpact(property, squashKey, amplitude, onComplete) {
          const strength = IMPACT_STRENGTH;
          if (strength === 0) {
            onComplete();
            return;
          }

          const squashTarget = squashKey === 'strawberry'
            ? this.berryTransform
            : this.sprites.get(squashKey);
          const baseScale = squashKey === 'strawberry'
            ? 1
            : assetByKey.get(squashKey).scale;

          this.tweens.add({
            targets: squashTarget,
            scaleX: baseScale * (1 + 0.08 * strength),
            scaleY: baseScale * (1 - 0.1 * strength),
            duration: 70,
            ease: 'Sine.InOut',
            yoyo: true,
            onUpdate: squashKey === 'strawberry' ? () => this.syncHierarchy() : undefined
          });

          this.tweens.add({
            targets: this.motion,
            [property]: amplitude * strength,
            duration: 70,
            ease: 'Cubic.In',
            onUpdate: () => this.syncHierarchy(),
            onComplete: () => {
              this.tweens.add({
                targets: this.motion,
                [property]: 0,
                duration: 190,
                ease: 'Back.Out',
                onUpdate: () => this.syncHierarchy(),
                onComplete: () => {
                  if (squashKey === 'strawberry') {
                    this.berryTransform.scaleX = 1;
                    this.berryTransform.scaleY = 1;
                    this.syncHierarchy();
                  } else {
                    squashTarget.setScale(baseScale);
                  }
                  onComplete();
                }
              });
            }
          });
        }

        update(time) {
          if (!this.floatingActive) return;

          const period = 2600 / FLOAT_SPEED;
          const phase = ((time - this.floatingStartedAt) % period) / period * Math.PI * 2;
          this.lockCompositionPose();
          this.compositionContainer.y = -Math.sin(phase) * FLOAT_HEIGHT;
        }

        startFloating() {
          if (FLOAT_HEIGHT === 0) return;

          this.compositionContainer.y = 0;
          this.lockCompositionPose();
          this.floatingStartedAt = this.time.now;
          this.floatingActive = true;
        }
      }

      if (!window.Phaser) {
        loading.textContent = 'Не удалось загрузить Phaser. Проверьте интернет и обновите страницу.';
        return;
      }

      new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game-container',
        width: WIDTH,
        height: HEIGHT,
        transparent: true,
        pixelArt: false,
        antialias: true,
        scene: BigWinScene,
        render: { pixelArt: false, roundPixels: false }
      });
    })();
  </script>
</body>
</html>
